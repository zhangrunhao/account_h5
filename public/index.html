<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>记账</title>
  <script>
    // 分辨率适配
    (function () {
      var winWidth = document.documentElement.clientWidth || window.screen.width || window.outerWidth || document
        .documentElement.scrollWidth;
      var winHeight = document.documentElement.clientHeight || window.screen.height || window.outerHeight || document
        .documentElement.scrollHeight;
      var ratio = 750 / 1334
      if ((winWidth / winHeight) < ratio) {
        var fontSizeRoot = winWidth / 375 * (100 / (750 / 375)) + 'px';
      } else {
        var fontSizeRoot = winHeight / 667 * (100 / (1334 / 667)) + 'px';
      }
      document.documentElement.style.fontSize = fontSizeRoot;
    })();
  </script>
</head>

<body>
  <div id="root"></div>
</body>

</html>
